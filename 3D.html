
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaMap 3D — Чернівці</title>

    <link
        href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>

const map = new maplibregl.Map({
    container: 'map',

    style: {
        version: 8,

        sources: {
            satellite: {
                type: 'raster',
                tiles: [
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                ],
                tileSize: 256,
                attribution: 'Tiles © Esri'
            }
        },

        layers: [
            {
                id: 'satellite',
                type: 'raster',
                source: 'satellite'
            }
        ]
    },

    center: [25.935, 48.292],
    zoom: 15,
    pitch: 60,
    bearing: -20,
    maxPitch: 85
});


// Кнопки керування картою

map.addControl(
    new maplibregl.NavigationControl({
        visualizePitch: true,
        showZoom: true,
        showCompass: true
    }),
    'top-right'
);


// Завантаження 3D-будинків

map.on('load', () => {

    map.addSource('buildings-source', {
        type: 'vector',
        url: 'https://tiles.openfreemap.org/planet'
    });

    map.addLayer({
        id: '3d-buildings',

        source: 'buildings-source',
        'source-layer': 'building',

        type: 'fill-extrusion',

        minzoom: 14,

        filter: [
            '!=',
            ['get', 'hide_3d'],
            true
        ],

        paint: {
            'fill-extrusion-color': '#d6d6d6',

            'fill-extrusion-height': [
                'interpolate',
                ['linear'],
                ['zoom'],
                14, 0,
                16, [
                    'coalesce',
                    ['get', 'render_height'],
                    8
                ]
            ],

            'fill-extrusion-base': [
                'coalesce',
                ['get', 'render_min_height'],
                0
            ],

            'fill-extrusion-opacity': 1
        }

    });

});

</script>

</body>
</html>
